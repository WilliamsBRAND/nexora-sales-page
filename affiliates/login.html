<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &middot; Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:100%;max-width:400px;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px 32px;}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;color:#c0404b;margin-bottom:24px;}
h1{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px;}
.sub{font-size:14px;color:#888;margin-bottom:28px;}
.field{margin-bottom:18px;}
label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:6px;}
input{width:100%;padding:14px 16px;font-size:15px;font-family:'Montserrat',sans-serif;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;outline:none;transition:border-color .2s;}
input:focus{border-color:#c0404b;}
input::placeholder{color:#555;}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#c0404b;color:#fff;font-weight:700;font-size:16px;font-family:'Montserrat',sans-serif;cursor:pointer;transition:background .2s,transform .2s;margin-top:8px;}
.btn:hover{background:#a83540;transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.err{color:#e85d6a;font-size:13px;min-height:18px;margin-top:-8px;margin-bottom:8px;}
.link{display:block;text-align:center;margin-top:16px;font-size:13px;color:#666;text-decoration:none;}
.link:hover{color:#c0404b;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Partners</div>
  <h1>Welcome back</h1>
  <p class="sub">Enter your email to access your dashboard.</p>

  <form id="loginForm">
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="err" id="err"></div>
    <button class="btn" type="submit" id="submitBtn">Send Login Link</button>
  </form>

  <a href="/affiliates/register" class="link">Not a partner yet? Register</a>
</div>

<script>
(function(){
  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      errEl.textContent = 'Please enter a valid email.';
      return;
    }
    errEl.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending link...';

    fetch('/api/partner?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){
        // Store partner data for dashboard
        localStorage.setItem('nexora_partner', JSON.stringify(d));
        document.querySelector('.card').innerHTML =
          '<div style="text-align:center;padding:20px 0;">' +
          '<div style="font-size:40px;margin-bottom:16px;">&#9993;</div>' +
          '<h2 style="font-family:Archivo,sans-serif;font-size:22px;margin-bottom:8px;">Welcome back, ' + d.name + '</h2>' +
          '<p style="font-size:14px;color:#888;">Redirecting to your dashboard...</p>' +
          '</div>';
        setTimeout(function(){ window.location.href = '/affiliates/dashboard'; }, 1200);
      } else {
        errEl.textContent = d.error || 'No account found with that email.';
        btn.disabled = false;
        btn.textContent = 'Send Login Link';
      }
    })
    .catch(function(){
      errEl.textContent = 'Network error. Try again.';
      btn.disabled = false;
      btn.textContent = 'Send Login Link';
    });
  });
})();
</script>
</body>
</html>
