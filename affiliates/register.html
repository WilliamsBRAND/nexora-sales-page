<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &middot; Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:100%;max-width:440px;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px 32px;}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;color:#c0404b;margin-bottom:24px;}
h1{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px;}
.sub{font-size:14px;color:#888;margin-bottom:28px;}
.field{margin-bottom:18px;}
label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:6px;}
input{width:100%;padding:14px 16px;font-size:15px;font-family:'Montserrat',sans-serif;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;outline:none;transition:border-color .2s;}
input:focus{border-color:#c0404b;}
input::placeholder{color:#555;}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#c0404b;color:#fff;font-weight:700;font-size:16px;font-family:'Montserrat',sans-serif;cursor:pointer;transition:background .2s,transform .2s;margin-top:8px;}
.btn:hover{background:#a83540;transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.err{color:#e85d6a;font-size:13px;min-height:18px;margin-top:-8px;margin-bottom:8px;}
.success{display:none;text-align:center;padding:20px 0;}
.success .icon{width:60px;height:60px;border-radius:50%;background:rgba(31,122,61,.15);border:1.5px solid rgba(31,122,61,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;}
.success h2{font-family:'Archivo',sans-serif;font-size:22px;margin-bottom:8px;}
.success p{font-size:14px;color:#888;margin-bottom:20px;}
.success .code-box{background:rgba(192,64,75,.1);border:1.5px solid rgba(192,64,75,.3);border-radius:10px;padding:14px;text-align:center;margin-bottom:20px;}
.success .code-box .label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:4px;}
.success .code-box .code{font-family:'Archivo',sans-serif;font-size:28px;font-weight:900;color:#c0404b;letter-spacing:2px;}
.link{display:block;text-align:center;margin-top:16px;font-size:13px;color:#666;text-decoration:none;}
.link:hover{color:#c0404b;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="card" id="formCard">
  <div class="logo">Partners</div>
  <h1>Create your account</h1>
  <p class="sub">Get your unique referral link in 30 seconds.</p>

  <form id="regForm">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name" required />
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="0801 234 5678" />
    </div>
    <div class="err" id="err"></div>
    <button class="btn" type="submit" id="submitBtn">Create Account</button>
  </form>

  <a href="/affiliates/login" class="link">Already a partner? Log in</a>
</div>

<div class="success" id="successCard">
  <div class="icon">&#10003;</div>
  <h2>You're in!</h2>
  <p>Here's your referral code. Share your link and start earning.</p>
  <div class="code-box">
    <div class="label">Your referral code</div>
    <div class="code" id="partnerCode"></div>
  </div>
  <p style="font-size:13px;color:#666;margin-bottom:12px;">Your referral link:</p>
  <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;word-break:break-all;font-size:13px;color:#c0404b;margin-bottom:20px;" id="refLink"></div>
  <a href="/affiliates/dashboard" class="btn" style="text-decoration:none;text-align:center;">Go to Dashboard</a>
  <a href="/" class="link">Back to site</a>
</div>

<script>
(function(){
  var form = document.getElementById('regForm');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');
  var formCard = document.getElementById('formCard');
  var successCard = document.getElementById('successCard');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var phone = document.getElementById('phone').value.trim();

    if(!name){ errEl.textContent = 'Please enter your name.'; return; }
    if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ errEl.textContent = 'Please enter a valid email.'; return; }

    errEl.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account...';

    fetch('/api/partner?action=register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, phone: phone })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){
        formCard.style.display = 'none';
        successCard.style.display = 'block';
        document.getElementById('partnerCode').textContent = d.code;
        document.getElementById('refLink').textContent = d.siteUrl + '?pp=' + d.code;
      } else {
        errEl.textContent = d.error || 'Something went wrong.';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    })
    .catch(function(){
      errEl.textContent = 'Network error. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    });
  });
})();
</script>
</body>
</html>
